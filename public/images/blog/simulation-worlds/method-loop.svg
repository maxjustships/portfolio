<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1000" role="img" aria-labelledby="loop-title loop-desc" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <title id="loop-title">The world-based testing loop</title>
  <desc id="loop-desc">A vertical loop of seven steps: build the world, run parallel independent sessions, read the observable trace, let an external scorecard check world state, name a reproducible bug, fix the flow CLI or gate, then rerun so the world becomes a regression test. After the loop come sealed worlds, shadow mode, one controlled live run, and gradual dogfooding.</desc>
  <rect width="560" height="1000" fill="#000000"/>

  <!-- step 1 -->
  <rect x="40" y="20" width="480" height="76" fill="#000000" stroke="#ffffff" stroke-width="3"/>
  <circle cx="76" cy="58" r="20" fill="#0ea5e9"/>
  <text x="76" y="66" text-anchor="middle" font-size="24" font-weight="900" fill="#000000">1</text>
  <text x="112" y="66" font-size="24" font-weight="700" fill="#ffffff">Build the world</text>
  <line x1="280" y1="96" x2="280" y2="128" stroke="#ffffff" stroke-width="3"/>
  <polygon points="280,136 272,122 288,122" fill="#ffffff"/>

  <!-- step 2 -->
  <rect x="40" y="136" width="480" height="76" fill="#000000" stroke="#ffffff" stroke-width="3"/>
  <circle cx="76" cy="174" r="20" fill="#0ea5e9"/>
  <text x="76" y="182" text-anchor="middle" font-size="24" font-weight="900" fill="#000000">2</text>
  <text x="112" y="182" font-size="24" font-weight="700" fill="#ffffff">Run parallel sessions</text>
  <line x1="280" y1="212" x2="280" y2="244" stroke="#ffffff" stroke-width="3"/>
  <polygon points="280,252 272,238 288,238" fill="#ffffff"/>

  <!-- step 3 -->
  <rect x="40" y="252" width="480" height="76" fill="#000000" stroke="#ffffff" stroke-width="3"/>
  <circle cx="76" cy="290" r="20" fill="#0ea5e9"/>
  <text x="76" y="298" text-anchor="middle" font-size="24" font-weight="900" fill="#000000">3</text>
  <text x="112" y="298" font-size="24" font-weight="700" fill="#ffffff">Read the observable trace</text>
  <line x1="280" y1="328" x2="280" y2="360" stroke="#ffffff" stroke-width="3"/>
  <polygon points="280,368 272,354 288,354" fill="#ffffff"/>

  <!-- step 4 -->
  <rect x="40" y="368" width="480" height="76" fill="#000000" stroke="#ffffff" stroke-width="3"/>
  <circle cx="76" cy="406" r="20" fill="#0ea5e9"/>
  <text x="76" y="414" text-anchor="middle" font-size="24" font-weight="900" fill="#000000">4</text>
  <text x="112" y="414" font-size="24" font-weight="700" fill="#ffffff">Scorecard checks world state</text>
  <line x1="280" y1="444" x2="280" y2="476" stroke="#ffffff" stroke-width="3"/>
  <polygon points="280,484 272,470 288,470" fill="#ffffff"/>

  <!-- step 5 -->
  <rect x="40" y="484" width="480" height="76" fill="#000000" stroke="#ffffff" stroke-width="3"/>
  <circle cx="76" cy="522" r="20" fill="#f97316"/>
  <text x="76" y="530" text-anchor="middle" font-size="24" font-weight="900" fill="#000000">5</text>
  <text x="112" y="530" font-size="24" font-weight="700" fill="#ffffff">Name a reproducible bug</text>
  <line x1="280" y1="560" x2="280" y2="592" stroke="#ffffff" stroke-width="3"/>
  <polygon points="280,600 272,586 288,586" fill="#ffffff"/>

  <!-- step 6 -->
  <rect x="40" y="600" width="480" height="76" fill="#000000" stroke="#ffffff" stroke-width="3"/>
  <circle cx="76" cy="638" r="20" fill="#f97316"/>
  <text x="76" y="646" text-anchor="middle" font-size="24" font-weight="900" fill="#000000">6</text>
  <text x="112" y="646" font-size="24" font-weight="700" fill="#ffffff">Fix the flow, CLI, or gate</text>
  <line x1="280" y1="676" x2="280" y2="708" stroke="#ffffff" stroke-width="3"/>
  <polygon points="280,716 272,702 288,702" fill="#ffffff"/>

  <!-- step 7 -->
  <rect x="40" y="716" width="480" height="76" fill="#000000" stroke="#f97316" stroke-width="3"/>
  <circle cx="76" cy="754" r="20" fill="#f97316"/>
  <text x="76" y="762" text-anchor="middle" font-size="24" font-weight="900" fill="#000000">7</text>
  <text x="112" y="750" font-size="24" font-weight="700" fill="#ffffff">Rerun — the world is now</text>
  <text x="112" y="778" font-size="24" font-weight="700" fill="#ffffff">a regression test</text>

  <!-- loop-back arrow from 7 to 1 -->
  <path d="M 40 754 L 16 754 L 16 58 L 40 58" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="40,58 26,50 26,66" fill="#f97316"/>

  <!-- graduation note -->
  <line x1="40" y1="832" x2="520" y2="832" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
  <text x="40" y="876" font-size="22" font-weight="700" letter-spacing="1" fill="#ffffff" opacity="0.7">THEN EARN TRUST, IN ORDER:</text>
  <text x="40" y="916" font-size="22" fill="#ffffff" opacity="0.85">Sealed worlds → shadow mode →</text>
  <text x="40" y="948" font-size="22" fill="#ffffff" opacity="0.85">one controlled live run → dogfooding</text>
</svg>
