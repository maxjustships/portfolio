<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-labelledby="chart-title chart-desc" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <title id="chart-title">Surface action correctness versus complete strict execution</title>
  <desc id="chart-desc">Bar chart of the same 140 attempted runs measured two ways. A surface check, correct high-level action, passes 87 percent (121 of 139 valid runs). The full strict execution contract passes 47 percent (66 of 140 attempted runs). The gap is 39.9 percentage points.</desc>
  <rect width="720" height="470" fill="#000000"/>

  <text x="30" y="44" font-size="21" font-weight="700" letter-spacing="2" fill="#ffffff" opacity="0.6">SAME RUNS, TWO DIFFERENT RULERS</text>

  <!-- bar 1: surface action -->
  <text x="30" y="104" font-size="26" font-weight="700" fill="#ffffff">Correct high-level action</text>
  <text x="690" y="106" text-anchor="end" font-size="44" font-weight="900" fill="#0ea5e9">87%</text>
  <rect x="30" y="122" width="574" height="44" fill="#0ea5e9"/>
  <rect x="30" y="122" width="660" height="44" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
  <text x="30" y="196" font-size="20" fill="#ffffff" opacity="0.65">121 of 139 valid runs</text>

  <!-- bar 2: full strict pass -->
  <text x="30" y="262" font-size="26" font-weight="700" fill="#ffffff">Full strict execution pass</text>
  <text x="690" y="264" text-anchor="end" font-size="44" font-weight="900" fill="#f97316">47%</text>
  <rect x="30" y="280" width="310" height="44" fill="#f97316"/>
  <rect x="30" y="280" width="660" height="44" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
  <text x="30" y="354" font-size="20" fill="#ffffff" opacity="0.65">66 of 140 attempted runs</text>

  <!-- gap note -->
  <line x1="340" y1="302" x2="604" y2="144" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-dasharray="6 6"/>
  <text x="30" y="412" font-size="24" font-weight="700" fill="#ffffff">Gap: 39.9 percentage points</text>
  <text x="30" y="444" font-size="20" fill="#ffffff" opacity="0.6">Every point is a run with at least one material contract failure.</text>
</svg>
